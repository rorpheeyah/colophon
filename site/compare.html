<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compare — colophon</title>
<link rel="stylesheet" href="assets/style.css">
<script>
  // Before paint, so a chosen theme never flashes the other one.
  try {
    const t = localStorage.getItem('colophon-theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch {}
</script>
</head>
<body>
<div class="top"><div class="wrap">
  <b>colophon</b>
  <nav><a href="index.html">Library</a><a href="compare.html" aria-current="page">Compare</a><a href="about.html">About</a></nav>
  <button class="theme" id="theme" aria-label="Change theme">
<svg data-t="system" width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">
  <circle cx="8" cy="8" r="5.9" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <path d="M8 2.1a5.9 5.9 0 000 11.8z" fill="currentColor"/></svg>
<svg data-t="light" width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">
  <circle cx="8" cy="8" r="3.1" fill="currentColor"/>
  <path d="M8 .9v2.1M8 13v2.1M.9 8h2.1M13 8h2.1M3 3l1.5 1.5M11.5 11.5L13 13M13 3l-1.5 1.5M4.5 11.5L3 13"
    stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
<svg data-t="dark" width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">
  <path d="M13.4 10.3A6.2 6.2 0 015.7 2.6a6.2 6.2 0 107.7 7.7z" fill="currentColor"/></svg></button>
</div></div>

<div class="wrap">
  <nav class="crumbs">
  <a href="index.html">Library</a> <span>/</span> <b>Compare</b>
</nav>
  <h1>Compare</h1>

  <div class="cbar">
    <label>Left <select id="a"><option value="lozenge">Lozenge</option><option value="newsprint">Newsprint</option><option value="pharmly">Pharmly</option></select></label>
    <label>Right <select id="b"><option value="lozenge">Lozenge</option><option value="newsprint">Newsprint</option><option value="pharmly">Pharmly</option></select></label>
    <span class="modes">
      <button class="chip" data-mode="light" aria-pressed="true">Light</button>
      <button class="chip" data-mode="dark" aria-pressed="false">Dark</button>
      <button class="chip" id="swap">Swap</button>
    </span>
  </div>

  <div class="cpair">
    <div><h2 id="ha"></h2><iframe id="fa" title="Left system preview"></iframe></div>
    <div><h2 id="hb"></h2><iframe id="fb" title="Right system preview"></iframe></div>
  </div>

  <h2 class="crule">Stated facts</h2>
  <div class="crow" id="facts"></div>

  <h2 class="crule">Where they disagree</h2>
  <div class="cdiff" id="diff"></div>
</div>
<script>
  const data = [{"slug":"lozenge","system":"Lozenge","version":"1.0","register":"utility","density":"compact","scripts":["latin","khmer"],"origin":"own","status":"active","bestFor":["dense data tables","retail and POS interfaces","inventory and status screens","bilingual products"],"avoidFor":["long-form reading","marketing pages","editorial layouts"],"aliases":{"--ds-bg":"var(--paper)","--ds-surface":"var(--card)","--ds-text":"var(--ink)","--ds-text-2":"var(--ink-2)","--ds-text-3":"var(--ink-3)","--ds-line":"var(--mist)","--ds-accent":"var(--citron)","--ds-radius-box":"var(--box)","--ds-radius-control":"var(--lz)","--ds-border-width":"0","--ds-border-color":"none","--ds-shadow":"none","--ds-button-bg":"var(--citron)","--ds-button-text":"var(--hemlock)","--ds-button2-bg":"var(--mist)","--ds-font-display":"var(--sans)","--ds-font-body":"var(--sans)","--ds-font-data":"none","--ds-gap":"var(--gap)","--ds-pad":"var(--pad-card)","--ds-success":"none","--ds-success-wash":"none","--ds-warn":"var(--amber)","--ds-warn-wash":"var(--amber-w)","--ds-alarm":"var(--verm)","--ds-alarm-wash":"var(--verm-w)","--ds-invert-bg":"var(--hemlock)","--ds-invert-text":"var(--on-hemlock)","--ds-invert-accent":"var(--citron)","--ds-hatch":"repeating-linear-gradient( 45deg, currentColor, currentColor 2px, transparent 2px, transparent 4px)","--ds-font-script":"var(--km)","--ds-scrim":"none","--ds-shadow-surface":"none","--ds-chart-1":"var(--hemlock)","--ds-chart-2":"none","--ds-chart-3":"none","--ds-chart-4":"none","--ds-chart-5":"none"}},{"slug":"newsprint","system":"Newsprint","version":"1.0","register":"editorial","density":"comfortable","scripts":["latin","khmer"],"origin":"own","status":"draft","bestFor":["long-form reading","documentation","reports and printed output","bilingual editorial layouts","ruled data tables"],"avoidFor":["high-speed data entry","dense operational dashboards","touch-first mobile interfaces"],"aliases":{"--ds-bg":"var(--paper)","--ds-surface":"var(--stock)","--ds-text":"var(--ink)","--ds-text-2":"var(--ink-2)","--ds-text-3":"var(--ink-3)","--ds-line":"var(--rule)","--ds-accent":"var(--ink)","--ds-radius-box":"var(--radius)","--ds-radius-control":"var(--radius)","--ds-border-width":"1px","--ds-border-color":"var(--ink)","--ds-shadow":"var(--offset) var(--offset) 0 var(--ink)","--ds-button-bg":"var(--stock)","--ds-button-text":"var(--ink)","--ds-button2-bg":"var(--stock)","--ds-font-display":"var(--display)","--ds-font-body":"var(--body)","--ds-font-data":"var(--data)","--ds-gap":"none","--ds-pad":"none","--ds-success":"var(--teal)","--ds-success-wash":"none","--ds-warn":"var(--mark)","--ds-warn-wash":"none","--ds-alarm":"var(--flag)","--ds-alarm-wash":"none","--ds-invert-bg":"none","--ds-invert-text":"none","--ds-invert-accent":"none","--ds-hatch":"none","--ds-font-script":"var(--body)","--ds-scrim":"none","--ds-shadow-surface":"none","--ds-chart-1":"none","--ds-chart-2":"none","--ds-chart-3":"none","--ds-chart-4":"none","--ds-chart-5":"none"}},{"slug":"pharmly","system":"Pharmly","version":"1.0","register":"utility","density":"spacious","scripts":["latin"],"origin":"reference","status":"active","bestFor":["admin dashboards","list-and-detail CRUD interfaces","portfolio presentation"],"avoidFor":["point of sale","high-density catalogues","non-Latin scripts","anything requiring speed at a counter"],"aliases":{"--ds-bg":"var(--paper)","--ds-surface":"var(--card)","--ds-text":"var(--ink)","--ds-text-2":"var(--ink-2)","--ds-text-3":"var(--ink-3)","--ds-line":"var(--mist)","--ds-accent":"var(--lime)","--ds-radius-box":"var(--radius-card)","--ds-radius-control":"var(--radius-pill)","--ds-border-width":"0","--ds-border-color":"none","--ds-shadow":"none","--ds-button-bg":"var(--lime)","--ds-button-text":"var(--ink)","--ds-button2-bg":"var(--card)","--ds-font-display":"var(--sans)","--ds-font-body":"var(--sans)","--ds-font-data":"none","--ds-gap":"none","--ds-pad":"none","--ds-success":"var(--ok)","--ds-success-wash":"none","--ds-warn":"var(--warn)","--ds-warn-wash":"none","--ds-alarm":"var(--fail)","--ds-alarm-wash":"none","--ds-invert-bg":"var(--pine)","--ds-invert-text":"var(--card)","--ds-invert-accent":"var(--lime)","--ds-hatch":"repeating-linear-gradient( 45deg, currentColor, currentColor 2px, transparent 2px, transparent 4px)","--ds-font-script":"none","--ds-scrim":"none","--ds-shadow-surface":"none","--ds-chart-1":"var(--pine)","--ds-chart-2":"none","--ds-chart-3":"none","--ds-chart-4":"none","--ds-chart-5":"none"}}];
  const by = Object.fromEntries(data.map(s => [s.slug, s]));
  const q = new URLSearchParams(location.search);
  const el = id => document.getElementById(id);
  let mode = q.get('mode') === 'dark' ? 'dark' : 'light';

  el('a').value = by[q.get('a')] ? q.get('a') : data[0].slug;
  el('b').value = by[q.get('b')] ? q.get('b') : (data[1] ?? data[0]).slug;

  const FACTS = ['register', 'density', 'origin', 'status'];
  const row = (k, v) => '<dt>' + k + '</dt><dd>' + v + '</dd>';
  const facts = s => FACTS.map(k => row(k, s[k])).join('') +
    row('scripts', s.scripts.join(', ')) +
    row('for', s.bestFor.join(', ')) +
    row('not', s.avoidFor.join(', '));

  function diff(a, b) {
    const names = [...new Set([...Object.keys(a.aliases), ...Object.keys(b.aliases)])].sort();
    const rows = names.filter(n => a.aliases[n] !== b.aliases[n]).map(n =>
      '<tr><td><code>' + n + '</code></td>' +
      '<td class="' + (a.aliases[n] === 'none' ? 'declined' : '') + '"><code>' + (a.aliases[n] ?? '—') + '</code></td>' +
      '<td class="' + (b.aliases[n] === 'none' ? 'declined' : '') + '"><code>' + (b.aliases[n] ?? '—') + '</code></td></tr>').join('');
    return rows
      ? '<table class="aliases"><thead><tr><th>Alias</th><th>' + a.system + '</th><th>' +
        b.system + '</th></tr></thead><tbody>' + rows + '</tbody></table>'
      : '<p class="empty">These two declare every alias identically.</p>';
  }

  function draw() {
    const a = by[el('a').value], b = by[el('b').value];
    for (const [side, s] of [['a', a], ['b', b]]) {
      el('f' + side).src = 's/' + s.slug + '/preview.html?mode=' + mode + '&chrome=0';
      el('h' + side).innerHTML = '<a href="s/' + s.slug + '/index.html">' + s.system +
        '</a> <em>' + s.version + '</em>';
    }
    el('facts').innerHTML =
      '<section><h3>' + a.system + '</h3><dl>' + facts(a) + '</dl></section>' +
      '<section><h3>' + b.system + '</h3><dl>' + facts(b) + '</dl></section>';
    el('diff').innerHTML = diff(a, b);
    history.replaceState(null, '', '?a=' + a.slug + '&b=' + b.slug + '&mode=' + mode);
  }

  // Fit each frame to the preview inside it: no dead space, nothing clipped,
  // whatever a given system's content adds up to. Measured from the parent
  // because both documents are same-origin — messaging from the frame would
  // race the parent's listener and usually lose.
  function fit(f) {
    const doc = f.contentDocument;
    if (!doc) return;
    const set = () => {
      const h = Math.ceil(doc.body.getBoundingClientRect().height) + 2;
      if (Math.abs(h - parseFloat(f.style.height || 0)) > 1) f.style.height = h + 'px';
    };
    set();
    if (doc.fonts) doc.fonts.ready.then(set);
    new ResizeObserver(set).observe(doc.body);
  }
  function fitAll(frames) {
    for (const f of frames) {
      f.addEventListener('load', () => fit(f));
      if (f.contentDocument && f.contentDocument.readyState === 'complete') fit(f);
    }
  }
  fitAll([el('fa'), el('fb')]);

  el('a').addEventListener('change', draw);
  el('b').addEventListener('change', draw);
  el('swap').addEventListener('click', () => {
    const t = el('a').value; el('a').value = el('b').value; el('b').value = t; draw();
  });
  for (const btn of document.querySelectorAll('[data-mode]')) {
    btn.addEventListener('click', () => {
      mode = btn.dataset.mode;
      document.querySelectorAll('[data-mode]').forEach(x =>
        x.setAttribute('aria-pressed', x.dataset.mode === mode));
      draw();
    });
  }
  document.querySelectorAll('[data-mode]').forEach(x =>
    x.setAttribute('aria-pressed', x.dataset.mode === mode));
  draw();
</script>
<footer><div class="wrap eyebrow">Generated from the repo</div></footer>
<script>
  // Site chrome only. A preview's light and dark come from its tokens block.
  (() => {
    const order = ['system', 'light', 'dark'];
    const btn = document.getElementById('theme');
    const read = () => { try { return localStorage.getItem('colophon-theme') || 'system'; } catch { return 'system'; } };
    const show = t => {
      if (t === 'system') delete document.documentElement.dataset.theme;
      else document.documentElement.dataset.theme = t;
      btn.dataset.state = t;
      btn.title = 'Theme: ' + t;
    };
    show(read());
    btn.addEventListener('click', () => {
      const next = order[(order.indexOf(read()) + 1) % order.length];
      try { localStorage.setItem('colophon-theme', next); } catch {}
      show(next);
    });
  })();
</script>
</body>
</html>
